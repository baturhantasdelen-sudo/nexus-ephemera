[workspace]
resolver = "2"
members = [".", "crates/memlock", "crates/ipc_os"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["Baturhan Taşdelen <baturhantasdelen@gmail.com>"]
repository = "https://github.com/baturhantasdelen-sudo/nexus-ephemera"
keywords = [
    "sensitive-memory",
    "broker-daemon",
    "process-isolation",
    "idempotency",
    "memlock",
]
categories = ["cryptography", "memory-management", "os"]

[workspace.dependencies]
nexus-ephemera-memlock = { version = "0.2.0", path = "crates/memlock" }
nexus-ephemera-ipc-os = { version = "0.2.0", path = "crates/ipc_os" }

[package]
name = "nexus-ephemera"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Sensitive-memory lifecycle protection for offline scout, AEAD mesh, and brokered agent calls"
exclude = ["crates/memlock/**", "crates/ipc_os/**", ".github/**"]

[lib]
name = "nexus_ephemera"
path = "src/lib.rs"

[[bin]]
name = "nexus-ephemera"
path = "src/main.rs"

[[bin]]
name = "nexus-daemon"
path = "src/daemon_main.rs"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
zeroize = "1.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chacha20poly1305 = "0.10"
sha2 = "0.10"
hmac = "0.12"
subtle = "2.6"
base64 = "0.22"
uuid = { version = "1.6", features = ["v4", "serde"] }
rand = "0.8"
nexus-ephemera-memlock.workspace = true
nexus-ephemera-ipc-os.workspace = true

[features]
default = []
# Optional entry points for a cargo-fuzz harness. Not built in production.
fuzz = []

[dev-dependencies]
tokio = { version = "1.0", features = ["rt", "macros"] }
zeroize = "1.7"

# Üretim ikilisi: LTO + strip; panik unwind (apoptosis catch_unwind).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false
debug-assertions = false
overflow-checks = true
incremental = false
panic = "unwind"

[profile.test]
overflow-checks = true

[[bench]]
name = "lifecycle_bench"
harness = false
