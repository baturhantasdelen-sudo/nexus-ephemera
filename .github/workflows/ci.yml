name: Nexus-Ephemera CI

on:
  push:
    branches: [ main, master, release/* ]
  pull_request:
    branches: [ main, master ]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  enterprise-redis:
    name: Real Redis multiprocess claims and durable failure paths
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXUS_TEST_REDIS_URL: redis://127.0.0.1:6379
      NEXUS_TEST_RESTART_NAMESPACE: restart-${{ github.run_id }}-${{ github.run_attempt }}
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - name: Require durable non-evicting Redis
        run: |
          set -euo pipefail
          docker run -d --name nexus-enterprise-redis -p 127.0.0.1:6379:6379 redis:7.4 redis-server --appendonly yes --appendfsync always --maxmemory-policy noeviction
          for i in {1..30}; do
            if docker exec nexus-enterprise-redis redis-cli ping | grep -q PONG; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run real backend tests (never silently skip)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/ci-evidence
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          cargo test --locked --release --lib enterprise_runtime::tests::redis_ -- --ignored --nocapture 2>&1 | tee outputs/ci-evidence/real-redis.log
          cargo test --locked --release --test enterprise_live -- --ignored --nocapture 2>&1 | tee outputs/ci-evidence/enterprise-live.log
          cargo test --locked --release --lib enterprise_runtime::tests::restart_seed_committed_receipt -- --ignored --exact --nocapture 2>&1 | tee outputs/ci-evidence/redis-restart-seed.log
          docker restart nexus-enterprise-redis
          for i in {1..30}; do
            if docker exec nexus-enterprise-redis redis-cli ping | grep -q PONG; then break; fi
            sleep 1
          done
          cargo test --locked --release --lib enterprise_runtime::tests::restart_verify_committed_receipt -- --ignored --exact --nocapture 2>&1 | tee outputs/ci-evidence/redis-restart-verify.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: real-redis-evidence
          path: outputs/ci-evidence
          if-no-files-found: error

  validate:
    name: Build, Clippy, Format & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare evidence directory
        shell: bash
        run: mkdir -p outputs/ci-evidence

      - name: Install Rust toolchain (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Check formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Run Clippy lints (-D warnings)
        env:
          CARGO_INCREMENTAL: 0
        shell: bash
        run: |
          rustc --version --verbose | tee outputs/ci-evidence/rustc-version.txt
          cargo clippy --version | tee outputs/ci-evidence/clippy-version.txt
          cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee outputs/ci-evidence/clippy.log

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Python SDK dev tools
        working-directory: clients/python
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Type-check Python SDK (mypy --strict)
        working-directory: clients/python
        shell: bash
        run: python -m mypy --strict 2>&1 | tee ../../outputs/ci-evidence/mypy.log

      - name: Test Python SDK (pytest)
        working-directory: clients/python
        shell: bash
        run: |
          mkdir -p ../../outputs/ci-evidence
          python -m pytest -v --junitxml=../../outputs/ci-evidence/python.xml 2>&1 | tee ../../outputs/ci-evidence/python.log

      - name: Test release packaging and architecture rejection
        run: python -m unittest discover -s scripts/tests -v

      - name: Run release test suite (including Linux fork & memlock probes)
        if: runner.os != 'Linux'
        env:
          RUSTFLAGS: "-D warnings"
        shell: bash
        run: cargo test --workspace --release --all-features -- --test-threads=1 2>&1 | tee outputs/ci-evidence/rust.log

      - name: Run release test suite (including Linux fork & memlock probes)
        if: runner.os == 'Linux'
        shell: bash
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          sudo prlimit --pid=$$ --memlock=unlimited:unlimited
          cargo test --workspace --release --all-features -- --test-threads=1 2>&1 | tee outputs/ci-evidence/rust.log

      - name: Verify fresh Unix bootstrap through the native file gate
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export NEXUS_PREFIX="$RUNNER_TEMP/nexus-bootstrap"
          sh scripts/install_daemon.sh 2>&1 | tee outputs/ci-evidence/bootstrap.log

      - name: Verify fresh Windows bootstrap through the native file gate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NEXUS_PREFIX = Join-Path $env:RUNNER_TEMP 'nexus-bootstrap'
          & ./scripts/install_daemon.ps1 2>&1 | Tee-Object outputs/ci-evidence/bootstrap.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Live Python daemon pilot (required on every platform)
        working-directory: clients/python
        shell: bash
        run: |
          binary="$GITHUB_WORKSPACE/target/release/nexus-daemon"
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary="${binary}.exe"; fi
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            # Each Actions step has a fresh shell; the Rust step's raised
            # limit is not inherited here. Match the documented pilot quota.
            prlimit --pid=$$ --memlock
            sudo prlimit --pid=$$ --memlock=67108864:67108864
            prlimit --pid=$$ --memlock
          fi
          NEXUS_DAEMON_EXE="$binary" python -m pytest tests/test_pilot_python_sdk.py -v --junitxml=../../outputs/ci-evidence/live-python.xml 2>&1 | tee ../../outputs/ci-evidence/live-python.log

      - name: Preserve source identity and raw pilot evidence
        if: always()
        shell: bash
        run: |
          mkdir -p outputs/ci-evidence
          git rev-parse HEAD > outputs/ci-evidence/commit.txt
          git status --porcelain > outputs/ci-evidence/worktree.txt
          python - <<'PY'
          import hashlib
          import pathlib
          import sys
          binary = pathlib.Path('target/release/nexus-daemon' + ('.exe' if sys.platform == 'win32' else ''))
          evidence = pathlib.Path('outputs/ci-evidence')
          if binary.is_file():
              (evidence / 'daemon-sha256.txt').write_text(
                  hashlib.sha256(binary.read_bytes()).hexdigest() + '  ' + str(binary) + '\n', encoding='utf-8')
          else:
              (evidence / 'daemon-not-built.txt').write_text(
                  'Release daemon was not produced; inspect preceding build/test steps.\n', encoding='utf-8')
          PY

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pilot-evidence-${{ matrix.os }}
          path: outputs/ci-evidence/
