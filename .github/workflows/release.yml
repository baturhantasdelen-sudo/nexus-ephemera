name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    # Kiritik Düzeltme: GITHUB_TOKEN için yazma izni tanımlanıyor
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binaries
        run: cargo build --release --workspace

      - name: Package Assets
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            cp target/release/*.exe dist/ 2>/dev/null || true
            cd dist && powershell Compress-Archive -Path *.exe -DestinationPath nexus-ephemera-${{ github.ref_name }}-${{ matrix.target }}.zip
          else
            cp target/release/nexus-* dist/ 2>/dev/null || true
            cd dist && tar -czf nexus-ephemera-${{ github.ref_name }}-${{ matrix.target }}.tar.gz nexus-*
          fi

      - name: Generate Checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > checksums.txt || shasum -a 256 * > checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
